name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------
  # 1. FRONTEND CI: Tests React / TypeScript
  # ----------------------------------------------------
  frontend-checks:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend
        run: npm run build

  # ----------------------------------------------------
  # 2. BACKEND CI: Tests Django & Database Migrations
  # ----------------------------------------------------
  backend-checks:
    name: Backend (Django Checks & Migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "ci-secret-key-for-automated-testing-only"
    steps:
      # Step A: Download your repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Install Python 3.12
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # Step C: Install backend packages from requirements.txt
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step D: Run Django system health check
      - name: Run Django System Check
        run: python manage.py check

      # Step E: Verify no pending or uncommitted database migrations
      - name: Verify Migrations
        run: python manage.py makemigrations --check --dry-run