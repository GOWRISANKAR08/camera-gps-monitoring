name: Project CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------
  # 1. FRONTEND CI: Tests React / TypeScript
  # ----------------------------------------------------
  frontend-checks:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend
        run: npm run build

  # ----------------------------------------------------
  # 2. BACKEND CI: Tests Django & Database Migrations
  # ----------------------------------------------------
  backend-checks:
    name: Backend (Django Checks & Migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "ci-secret-key-for-automated-testing-only"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Check
        run: python manage.py check

      - name: Verify Migrations
        run: python manage.py makemigrations --check --dry-run

  # ----------------------------------------------------
  # 3. CONTINUOUS DEPLOYMENT: Deploy to AWS EC2
  # ----------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    needs: [frontend-checks, backend-checks] # Only runs if BOTH frontend and backend pass!
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting Automated Deployment on AWS EC2..."
            cd ~/camera-gps-monitoring

            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐍 Updating Backend..."
            if [ -d "backend/.venv" ]; then
              source backend/.venv/bin/activate
            elif [ -d "$HOME/.venv" ]; then
              source $HOME/.venv/bin/activate
            fi
            pip install -r backend/requirements.txt --quiet
            python backend/manage.py migrate --noinput
            python backend/manage.py collectstatic --noinput

            echo "⚛️ Building Frontend..."
            cd frontend
            npm install --no-audit
            npm run build
            cd ..

            echo "🔄 Restarting Services..."
            sudo systemctl restart cameragps
            sudo nginx -t
            sudo systemctl reload nginx

            echo "✅ Deployment Successful!"